
name: Build PixelPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [ -f "PixelPro/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=PixelPro" >> "$GITHUB_ENV"

          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Proyek Android tidak ditemukan."
              find . -maxdepth 4 -type f | head -200
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: settings.gradle.kts tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelPro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
